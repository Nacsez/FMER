<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img"><title>Shortcuts / one-sheet reference</title><desc>Hold the modifier first. SELECT is the rotary encoder; SEL is the button.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ff78d4"/></marker></defs><rect width="1800" height="1400" fill="#070709"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="42" fill="#76ff53" font-weight="800">FMER</text><text x="1736" text-anchor="end" y="55" font-size="18" fill="#b6bbc6" font-weight="400">734 / FIELD GUIDE</text><path d="M64 86H1736" stroke="#c9a0ff"/><text x="64" y="143" font-size="40" fill="#f5f7fa" font-weight="650">Shortcuts / one-sheet reference</text><text x="64" y="183" font-size="24" fill="#b6bbc6" font-weight="400">Hold the modifier first. SELECT is the rotary encoder; SEL is the button.</text><rect x="64" y="211" width="1672" height="60" fill="#101014"/><text x="84" y="245" font-size="24" fill="#76ff53" font-weight="600">Hold SEL → press SEQ</text><text x="900" y="245" font-size="23" fill="#f5f7fa" font-weight="400">Open Song and select four-track mode</text><text x="84" y="307" font-size="24" fill="#76ff53" font-weight="600">Hold HOME → press SEQ</text><text x="900" y="307" font-size="23" fill="#f5f7fa" font-weight="400">Open Mixer and select four-track mode</text><rect x="64" y="335" width="1672" height="60" fill="#101014"/><text x="84" y="369" font-size="24" fill="#76ff53" font-weight="600">Hold SEL → press HOME</text><text x="900" y="369" font-size="23" fill="#f5f7fa" font-weight="400">Toggle four-track / four-voice instrument</text><text x="84" y="431" font-size="24" fill="#76ff53" font-weight="600">Hold ENV → press HOME</text><text x="900" y="431" font-size="23" fill="#f5f7fa" font-weight="400">Select mono instrument with legato glide</text><rect x="64" y="459" width="1672" height="60" fill="#101014"/><text x="84" y="493" font-size="24" fill="#76ff53" font-weight="600">Hold LFO → press HOME</text><text x="900" y="493" font-size="23" fill="#f5f7fa" font-weight="400">Select four-voice instrument; glide off</text><text x="84" y="555" font-size="24" fill="#76ff53" font-weight="600">Hold SEL → press FX</text><text x="900" y="555" font-size="23" fill="#f5f7fa" font-weight="400">Save current FX order as personal default</text><rect x="64" y="583" width="1672" height="60" fill="#101014"/><text x="84" y="617" font-size="24" fill="#76ff53" font-weight="600">Hold FX / SEQ / EDIT / GLO / LFO</text><text x="900" y="617" font-size="23" fill="#f5f7fa" font-weight="400">After 0.8 s, return to that section’s landing page</text><text x="84" y="679" font-size="24" fill="#76ff53" font-weight="600">Press HOME again on HOME</text><text x="900" y="679" font-size="23" fill="#f5f7fa" font-weight="400">Toggle expanded oscilloscope view</text><rect x="64" y="707" width="1672" height="60" fill="#101014"/><text x="84" y="741" font-size="24" fill="#76ff53" font-weight="600">Press ARP again / LFO again</text><text x="900" y="741" font-size="23" fill="#f5f7fa" font-weight="400">Toggle the respective stored function</text><text x="84" y="803" font-size="24" fill="#76ff53" font-weight="600">Hold SEL + turn an ordinary parameter knob</text><text x="900" y="803" font-size="23" fill="#f5f7fa" font-weight="400">Use fine adjustment; context actions take priority</text><rect x="64" y="831" width="1672" height="60" fill="#101014"/><text x="84" y="865" font-size="24" fill="#76ff53" font-weight="600">Hold SEL + press PLAY</text><text x="900" y="865" font-size="23" fill="#f5f7fa" font-weight="400">Queue selected track for the next 16-step bar</text><text x="84" y="927" font-size="24" fill="#76ff53" font-weight="600">Hold SEL + double-press PLAY</text><text x="900" y="927" font-size="23" fill="#f5f7fa" font-weight="400">Queue all tracks for the next 16-step bar</text><rect x="64" y="955" width="1672" height="60" fill="#101014"/><text x="84" y="989" font-size="24" fill="#76ff53" font-weight="600">NOTE EDIT: ALGORITHM / SEL</text><text x="900" y="989" font-size="23" fill="#f5f7fa" font-weight="400">Move the logical note in time / delete it</text><text x="84" y="1051" font-size="24" fill="#76ff53" font-weight="600">NOTE EDIT: hold SEL + turn pitch down/up</text><text x="900" y="1051" font-size="23" fill="#f5f7fa" font-weight="400">Insert Rest / Tie</text><rect x="64" y="1079" width="1672" height="60" fill="#101014"/><text x="84" y="1113" font-size="24" fill="#76ff53" font-weight="600">PRESETS / GLO K1</text><text x="900" y="1113" font-size="23" fill="#f5f7fa" font-weight="400">Browse sounds across banks / choose 1V,4V,4T</text><text x="84" y="1175" font-size="24" fill="#76ff53" font-weight="600">SAVE: choose scope, slot, action → SEL</text><text x="900" y="1175" font-size="23" fill="#f5f7fa" font-weight="400">Confirm instrument or project Save/Load</text><text x="76" y="1274" font-size="21" fill="#f5f7fa" font-weight="400">Mode changes involving 4T, SAVE/LOAD and saving a personal FX default stop playback. Track launch shortcuts are unavailable</text><text x="76" y="1302" font-size="21" fill="#f5f7fa" font-weight="400">during recording.</text><path d="M64 1334H1736" stroke="#4b4e5a"/><text x="64" y="1370" font-size="18" fill="#b6bbc6" font-weight="400">FMER 734 / GLO contains the on-device icon legend and shortcut page</text></g></svg>