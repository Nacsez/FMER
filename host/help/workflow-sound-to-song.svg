<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>From sound to arrangement</title><desc>WORKFLOW / follow the numbered steps or read each storage layer in order</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ff78d4"/></marker></defs><rect width="1800" height="1200" fill="#070709"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="42" fill="#76ff53" font-weight="800">FMER</text><text x="1736" text-anchor="end" y="55" font-size="18" fill="#b6bbc6" font-weight="400">734 / FIELD GUIDE</text><path d="M64 86H1736" stroke="#c9a0ff"/><text x="64" y="143" font-size="40" fill="#f5f7fa" font-weight="650">From sound to arrangement</text><text x="64" y="183" font-size="24" fill="#b6bbc6" font-weight="400">WORKFLOW / follow the numbered steps or read each storage layer in order</text><rect x="64" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="303" font-size="26" fill="#76ff53" font-weight="650">01 / CHOOSE</text><text x="92" y="350" font-size="25" fill="#f5f7fa" font-weight="400">Select 1V,4V or 4T in GLO. Browse</text><text x="92" y="383" font-size="25" fill="#f5f7fa" font-weight="400">with PRESETS.</text><path d="M596 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="303" font-size="26" fill="#76ff53" font-weight="650">02 / DESIGN</text><text x="662" y="350" font-size="25" fill="#f5f7fa" font-weight="400">EDIT, ENV, LFO and FX shape the</text><text x="662" y="383" font-size="25" fill="#f5f7fa" font-weight="400">working instrument.</text><path d="M1166 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="303" font-size="26" fill="#76ff53" font-weight="650">03 / SAVE SOUND</text><text x="1232" y="350" font-size="25" fill="#f5f7fa" font-weight="400">SAVE / Instrument. Choose bank</text><text x="1232" y="383" font-size="25" fill="#f5f7fa" font-weight="400">and slot; confirm SEL.</text><rect x="64" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="633" font-size="26" fill="#76ff53" font-weight="650">04 / RECORD</text><text x="92" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Choose pattern and length. REC</text><text x="92" y="713" font-size="25" fill="#f5f7fa" font-weight="400">uses Step, Overdub or Replace.</text><path d="M596 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="633" font-size="26" fill="#76ff53" font-weight="650">05 / ARRANGE</text><text x="662" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Assign track sounds and</text><text x="662" y="713" font-size="25" fill="#f5f7fa" font-weight="400">patterns. Add Song repeats and</text><text x="662" y="746" font-size="25" fill="#f5f7fa" font-weight="400">transpose.</text><path d="M1166 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="633" font-size="26" fill="#76ff53" font-weight="650">06 / PRESERVE</text><text x="1232" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Save Project. Back up the unit</text><text x="1232" y="713" font-size="25" fill="#f5f7fa" font-weight="400">in Companion.</text><text x="76" y="1005" font-size="25" fill="#f5f7fa" font-weight="400">Tracks reference saved instrument slots. Save edited sounds before the project.</text><path d="M64 1134H1736" stroke="#4b4e5a"/><text x="64" y="1170" font-size="18" fill="#b6bbc6" font-weight="400">FMER 734 / workflow reference / arrows indicate reading order, not automatic file transfer</text></g></svg>