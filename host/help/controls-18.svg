<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img"><rect width="880" height="270" rx="16" fill="#101014"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f5f7fa"><text x="24" y="35" font-size="22">FM LFO / FM SYNC</text><rect x="24" y="60" width="196" height="124" rx="12" fill="#1b1b23"/><circle cx="122" cy="98" r="22" fill="#09090d" stroke="#76ff53" stroke-width="3"/><path d="M122 98v-17" stroke="#ff78d4" stroke-width="3"/><text x="122" y="144" text-anchor="middle" font-size="16">K1</text><text x="122" y="170" text-anchor="middle" font-size="13">Delay</text><rect x="236" y="60" width="196" height="124" rx="12" fill="#1b1b23"/><circle cx="334" cy="98" r="22" fill="#09090d" stroke="#76ff53" stroke-width="3"/><path d="M334 98v-17" stroke="#ff78d4" stroke-width="3"/><text x="334" y="144" text-anchor="middle" font-size="16">K2</text><text x="334" y="170" text-anchor="middle" font-size="13">Pitch sensitivity</text><rect x="448" y="60" width="196" height="124" rx="12" fill="#1b1b23"/><circle cx="546" cy="98" r="22" fill="#09090d" stroke="#76ff53" stroke-width="3"/><path d="M546 98v-17" stroke="#ff78d4" stroke-width="3"/><text x="546" y="144" text-anchor="middle" font-size="16">K3</text><text x="546" y="170" text-anchor="middle" font-size="13">LFO sync</text><rect x="660" y="60" width="196" height="124" rx="12" fill="#1b1b23"/><circle cx="758" cy="98" r="22" fill="#09090d" stroke="#76ff53" stroke-width="3"/><path d="M758 98v-17" stroke="#ff78d4" stroke-width="3"/><text x="758" y="144" text-anchor="middle" font-size="16">K4</text><text x="758" y="170" text-anchor="middle" font-size="13">Oscillator sync</text><text x="24" y="213" font-size="15" fill="#b6bbc6">Repeated LFO toggles; use SELECT for the other page. </text></g></svg>