<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>Song arrangements</title><desc>Arrange patterns, transpositions and repeats on a shared timeline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ff78d4"/></marker></defs><rect width="1800" height="1200" fill="#070709"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="42" fill="#76ff53" font-weight="800">FMER</text><text x="1736" text-anchor="end" y="55" font-size="18" fill="#b6bbc6" font-weight="400">734 / FIELD GUIDE</text><path d="M64 86H1736" stroke="#c9a0ff"/><text x="64" y="143" font-size="40" fill="#f5f7fa" font-weight="650">Song arrangements</text><text x="64" y="183" font-size="24" fill="#b6bbc6" font-weight="400">Arrange patterns, transpositions and repeats on a shared timeline.</text><text x="76" y="235" font-size="23" fill="#76ff53" font-weight="650">SEQ / SONG ENTRIES</text><rect x="68" y="262" width="496" height="496" rx="8" fill="#101014" stroke="#4b4e5a"/><image x="76" y="270" width="480" height="480" style="image-rendering:pixelated" href="data:image/png;base64,"/><path d="M581 342L340.0 440.0" stroke="#ff78d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="591" y="350" font-size="22" fill="#ff78d4" font-weight="700">01</text><text x="591" y="384" font-size="23" fill="#f5f7fa" font-weight="400">Repeat blocks align</text><text x="591" y="415" font-size="23" fill="#f5f7fa" font-weight="400">to musical time</text><path d="M581 567L396.0 636.0" stroke="#ff78d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="591" y="575" font-size="22" fill="#ff78d4" font-weight="700">02</text><text x="591" y="609" font-size="23" fill="#f5f7fa" font-weight="400">Entry, pattern,</text><text x="591" y="640" font-size="23" fill="#f5f7fa" font-weight="400">transpose, repeats</text><text x="936" y="235" font-size="23" fill="#76ff53" font-weight="650">SEQ / SONG SETUP</text><rect x="928" y="262" width="496" height="496" rx="8" fill="#101014" stroke="#4b4e5a"/><image x="936" y="270" width="480" height="480" style="image-rendering:pixelated" href="data:image/png;base64,"/><path d="M1441 342L1208.0 342.0" stroke="#ff78d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1451" y="350" font-size="22" fill="#ff78d4" font-weight="700">01</text><text x="1451" y="384" font-size="23" fill="#f5f7fa" font-weight="400">Lane and current</text><text x="1451" y="415" font-size="23" fill="#f5f7fa" font-weight="400">entry</text><path d="M1441 567L1242.0 668.0" stroke="#ff78d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1451" y="575" font-size="22" fill="#ff78d4" font-weight="700">02</text><text x="1451" y="609" font-size="23" fill="#f5f7fa" font-weight="400">Live/Song, end</text><text x="1451" y="640" font-size="23" fill="#f5f7fa" font-weight="400">behavior,</text><text x="1451" y="671" font-size="23" fill="#f5f7fa" font-weight="400">insert/delete</text><text x="76" y="845" font-size="23" fill="#ff78d4" font-weight="700">01</text><text x="128" y="845" font-size="24" fill="#f5f7fa" font-weight="400">32 entries per lane; patterns 0–15 or a 16-step rest. Repeats 1–32; transpose−24..+24 semitones.</text><text x="76" y="919" font-size="23" fill="#ff78d4" font-weight="700">02</text><text x="128" y="919" font-size="24" fill="#f5f7fa" font-weight="400">ALGORITHM chooses the lane; SEL switches Entries/Setup. End behavior is Stop or Loop.</text><text x="76" y="993" font-size="23" fill="#ff78d4" font-weight="700">03</text><text x="128" y="993" font-size="24" fill="#f5f7fa" font-weight="400">Single-instrument modes use one active lane; 4T uses four. Save the project to retain the arrangement.</text><path d="M64 1134H1736" stroke="#4b4e5a"/><text x="64" y="1170" font-size="18" fill="#b6bbc6" font-weight="400">Actual 734 renderer / illustrative state / annotations outside the software</text></g></svg>