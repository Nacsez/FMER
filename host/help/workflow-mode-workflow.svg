<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>Choose the right playing mode</title><desc>WORKFLOW / follow the numbered steps or read each storage layer in order</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ff78d4"/></marker></defs><rect width="1800" height="1200" fill="#070709"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="42" fill="#76ff53" font-weight="800">FMER</text><text x="1736" text-anchor="end" y="55" font-size="18" fill="#b6bbc6" font-weight="400">735 / FIELD GUIDE</text><path d="M64 86H1736" stroke="#c9a0ff"/><text x="64" y="143" font-size="40" fill="#f5f7fa" font-weight="650">Choose the right playing mode</text><text x="64" y="183" font-size="24" fill="#b6bbc6" font-weight="400">WORKFLOW / follow the numbered steps or read each storage layer in order</text><rect x="64" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="303" font-size="26" fill="#76ff53" font-weight="650">1V / MONO</text><text x="92" y="350" font-size="25" fill="#f5f7fa" font-weight="400">One instrument and glide for</text><text x="92" y="383" font-size="25" fill="#f5f7fa" font-weight="400">connected lead or bass lines.</text><path d="M596 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="303" font-size="26" fill="#76ff53" font-weight="650">6V / POLY</text><text x="662" y="350" font-size="25" fill="#f5f7fa" font-weight="400">One instrument; keys, arp and</text><text x="662" y="383" font-size="25" fill="#f5f7fa" font-weight="400">one sequence share six voices.</text><path d="M1166 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="303" font-size="26" fill="#76ff53" font-weight="650">4T / PARTS</text><text x="1232" y="350" font-size="25" fill="#f5f7fa" font-weight="400">Four independent mono tracks,</text><text x="1232" y="383" font-size="25" fill="#f5f7fa" font-weight="400">each with an instrument</text><text x="1232" y="416" font-size="25" fill="#f5f7fa" font-weight="400">reference.</text><rect x="64" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="633" font-size="26" fill="#76ff53" font-weight="650">DIRECT ACCESS</text><text x="92" y="680" font-size="25" fill="#f5f7fa" font-weight="400">GLO K1 or SEQ / PLAY MODE K1</text><text x="92" y="713" font-size="25" fill="#f5f7fa" font-weight="400">changes allocation explicitly.</text><path d="M596 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="633" font-size="26" fill="#76ff53" font-weight="650">PERFORM</text><text x="662" y="680" font-size="25" fill="#f5f7fa" font-weight="400">4T opens Mixer. Single-</text><text x="662" y="713" font-size="25" fill="#f5f7fa" font-weight="400">instrument modes open one-lane</text><text x="662" y="746" font-size="25" fill="#f5f7fa" font-weight="400">Song.</text><path d="M1166 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="633" font-size="26" fill="#76ff53" font-weight="650">RETURN</text><text x="1232" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Hold SEQ 0.8 s to return. Use HOME</text><text x="1232" y="713" font-size="25" fill="#f5f7fa" font-weight="400">for scopes; FX for effects.</text><text x="76" y="1005" font-size="25" fill="#f5f7fa" font-weight="400">Entering/leaving 4T stops playback. Ordinary page navigation and preset browsing do not change mode.</text><path d="M64 1134H1736" stroke="#4b4e5a"/><text x="64" y="1170" font-size="18" fill="#b6bbc6" font-weight="400">FMER 735 / workflow reference / arrows indicate reading order, not automatic file transfer</text></g></svg>