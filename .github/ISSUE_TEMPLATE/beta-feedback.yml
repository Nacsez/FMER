name: Beta feedback
description: Report your FMER testing experience; all test areas are optional.
title: "[Beta] "
labels: ["feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thank you for testing. Use issues for feedback; code contributions are currently reserved. Do not attach ROMs, private libraries or entire AppData folders."
  - type: input
    id: versions
    attributes:
      label: Versions and setup
      description: Full Companion footer version (for example 734 r5), firmware, OS, starting firmware and connections. The diagnostic export may show only 734.
  - type: checkboxes
    id: areas
    attributes:
      label: Areas tried (optional)
      options:
        - label: Companion and library
        - label: Installation or recovery
        - label: Sounds, engines or playing modes
        - label: FX or arpeggiator
        - label: Sequencer, Song or mixer
        - label: Saving and recall
        - label: MIDI or USB audio
        - label: Standalone use, battery or navigation
  - type: textarea
    id: experience
    attributes:
      label: What did you test and how did it go?
      description: Positive results are useful too. Mention approximate session length and skip untested areas.
  - type: textarea
    id: reproduction
    attributes:
      label: Expected behavior, actual behavior and reproduction steps
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic summary or media
      description: Attach the companion Beta feedback export (ZIP if needed). Review for personal information first. Media is optional.
