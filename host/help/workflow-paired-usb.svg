<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>Two-unit USB performance</title><desc>WORKFLOW / follow the numbered steps or read each storage layer in order</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ff78d4"/></marker></defs><rect width="1800" height="1200" fill="#070709"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="42" fill="#76ff53" font-weight="800">FMER</text><text x="1736" text-anchor="end" y="55" font-size="18" fill="#b6bbc6" font-weight="400">734 / FIELD GUIDE</text><path d="M64 86H1736" stroke="#c9a0ff"/><text x="64" y="143" font-size="40" fill="#f5f7fa" font-weight="650">Two-unit USB performance</text><text x="64" y="183" font-size="24" fill="#b6bbc6" font-weight="400">WORKFLOW / follow the numbered steps or read each storage layer in order</text><rect x="64" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="303" font-size="26" fill="#76ff53" font-weight="650">01 / PREPARE</text><text x="92" y="350" font-size="25" fill="#f5f7fa" font-weight="400">Keep both units powered.</text><text x="92" y="383" font-size="25" fill="#f5f7fa" font-weight="400">Disconnect their computer</text><text x="92" y="416" font-size="25" fill="#f5f7fa" font-weight="400">cables.</text><path d="M596 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="303" font-size="26" fill="#76ff53" font-weight="650">02 / CHOOSE ROLES</text><text x="662" y="350" font-size="25" fill="#f5f7fa" font-weight="400">GLO / USB LINK: Master on one,</text><text x="662" y="383" font-size="25" fill="#f5f7fa" font-weight="400">Receiver on the other.</text><path d="M1166 380h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="255" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="303" font-size="26" fill="#76ff53" font-weight="650">03 / APPLY + CONNECT</text><text x="1232" y="350" font-size="25" fill="#f5f7fa" font-weight="400">SEL applies. Join the two USB-C</text><text x="1232" y="383" font-size="25" fill="#f5f7fa" font-weight="400">ports with a data cable.</text><rect x="64" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="92" y="633" font-size="26" fill="#76ff53" font-weight="650">04 / SET TRAFFIC</text><text x="92" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Master: Clock, Notes or Both.</text><text x="92" y="713" font-size="25" fill="#f5f7fa" font-weight="400">Avoid unintended note doubling.</text><path d="M596 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="634" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="662" y="633" font-size="26" fill="#76ff53" font-weight="650">05 / PERFORM</text><text x="662" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Leader transport controls the</text><text x="662" y="713" font-size="25" fill="#f5f7fa" font-weight="400">shared time; each keeps its own</text><text x="662" y="746" font-size="25" fill="#f5f7fa" font-weight="400">sounds.</text><path d="M1166 710h34" stroke="#ff78d4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1204" y="585" width="530" height="250" rx="12" fill="#101014" stroke="#76ff53" stroke-width="2"/><text x="1232" y="633" font-size="26" fill="#76ff53" font-weight="650">06 / RETURN TO PC</text><text x="1232" y="680" font-size="25" fill="#f5f7fa" font-weight="400">Choose PC/NORMAL and press SEL</text><text x="1232" y="713" font-size="25" fill="#f5f7fa" font-weight="400">before Companion use.</text><text x="76" y="1005" font-size="25" fill="#f5f7fa" font-weight="400">One direct peer. No direct USB audio between units, USB hub mode or Bluetooth group support.</text><path d="M64 1134H1736" stroke="#4b4e5a"/><text x="64" y="1170" font-size="18" fill="#b6bbc6" font-weight="400">FMER 734 / workflow reference / arrows indicate reading order, not automatic file transfer</text></g></svg>